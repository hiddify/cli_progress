[project]
name = "cli_progress"
dynamic = ["version"]
description = "Run a command behind a calm full-screen progress window"
readme = "README.md"
license = "Unlicense"
license-files = ["LICENSE"]
authors = [{ name = "hiddify" }]
requires-python = ">=3.10"
dependencies = ["urwid>=2.6,<4"]
classifiers = [
    "Environment :: Console :: Curses",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/hiddify/cli_progress"

[project.scripts]
cli_progress = "cli_progress.__main__:main"

[dependency-groups]
dev = ["pytest", "pytest-cov", "coverage", "flake8", "black", "isort", "mypy"]
docs = ["mkdocs"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The version is the one line of cli_progress/VERSION (make release writes it)
[tool.hatch.version]
path = "cli_progress/VERSION"
pattern = "(?P<version>[^\\s]+)"

[tool.hatch.build.targets.sdist]
include = ["cli_progress", "tests", "README.md", "LICENSE", "HISTORY.md"]

[tool.hatch.build.targets.wheel]
packages = ["cli_progress"]

[tool.black]
line-length = 159

[tool.isort]
profile = "black"
line_length = 159

[tool.mypy]
ignore_missing_imports = true
